<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ClearText Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 24px;
      color: #0f172a;
      background: #f8fafc;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    p.desc { color: #64748b; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #334155; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 10px 12px; font-size: 13px;
      border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 12px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 18px; background: #2563eb; color: #fff; border: none;
      border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .status { margin-top: 12px; font-size: 12.5px; font-weight: 600; color: #10b981; min-height: 18px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>ClearText Settings</h1>
  <p class="desc">
    ClearText uses the Groq API to power translations, page summaries, and quizzes.
    Get a free API key from <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>
    and paste it below. Your key is stored only in your browser's local extension storage
    and is never sent anywhere except directly to Groq's API.
  </p>

  <label for="apiKey">Groq API Key</label>
  <input type="password" id="apiKey" placeholder="gsk_..." autocomplete="off">
  <button id="saveBtn">Save</button>
  <div id="status" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
